<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF--8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Socially - AI LinkedIn Assistant</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
          },
          colors: {
            background: '#F8F7FA', // Off-white background
            surface: '#FFFFFF', // Card and modal backgrounds
            'surface-accent': '#F0F0F5', // Hover states, subtle backgrounds
            primary: '#6A45E1', // Main brand color (purple)
            'primary-hover': '#5838C1',
            'primary-accent': '#EBE5FF', // Lighter shade for backgrounds/accents
            text: {
              primary: '#1A1A26', // Dark text for high contrast
              secondary: '#6B6B78', // Lighter text for subheadings, descriptions
            },
            border: {
              color: '#E3E3E9'
            },
            'glass-edge': 'rgba(255, 255, 255, 0.25)',
            'glass-surface': 'rgba(255, 255, 255, 0.05)',
            'dark-slate': '#0D1117',
          },
          boxShadow: {
            subtle: '0px 4px 12px rgba(0, 0, 0, 0.05)',
            md: '0px 8px 24px rgba(0, 0, 0, 0.08)',
            lg: '0px 16px 48px rgba(0, 0, 0, 0.12)',
          },
          keyframes: {
            fadeInUp: {
              '0%': { opacity: '0', transform: 'translateY(20px)' },
              '100%': { opacity: '1', transform: 'translateY(0)' },
            },
            subtleFloat: {
              '0%, 100%': { transform: 'translateY(0)' },
              '50%': { transform: 'translateY(-8px)' },
            }
          },
          animation: {
            fadeInUp: 'fadeInUp 0.8s ease-out forwards',
            subtleFloat: 'subtleFloat 6s ease-in-out infinite',
          }
        }
      }
    }
  </script>
  <script type="importmap">
  {
    "imports": {
      "react": "https://aistudiocdn.com/react@^19.2.0",
      "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.0/",
      "react/": "https://aistudiocdn.com/react@^19.2.0/",
      "@google/genai": "https://aistudiocdn.com/@google/genai@^1.27.0"
    }
  }
  </script>
  <style>
    body {
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }
    /* Hide scrollbar for Chrome, Safari and Opera */
    .hide-scrollbar::-webkit-scrollbar {
        display: none;
    }

    /* Hide scrollbar for IE, Edge and Firefox */
    .hide-scrollbar {
        -ms-overflow-style: none;  /* IE and Edge */
        scrollbar-width: none;  /* Firefox */
    }
  </style>
<link rel="stylesheet" href="/index.css">
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
